<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="./css/main.css">

    <title></title>
</head>

<body>

    <header class="c-header-wrapper">
        <div class="c-header">

            <div class="c-header__right">
                <button class="c-header__toggle" id="js-header-toggle" aria-label="Toggle menu">
                    <span class="c-header__toggle-line"></span>
                    <span class="c-header__toggle-line"></span>
                    <span class="c-header__toggle-line"></span>
                </button>

                <a href="#" class="c-logo">
                    <span class="c-logo__text">لمی دنت</span>
                </a>
            </div>

            <nav class="c-navbar" id="js-navbar">
                <ul class="c-navbar__list">
                    <li class="c-navbar__item">
                        <a href="#" class="c-navbar__link c-navbar__link--active">نوبت ها</a>
                    </li>
                    <li class="c-navbar__item">
                        <a href="#" class="c-navbar__link">پزشکان</a>
                    </li>
                    <li class="c-navbar__item">
                        <a href="#" class="c-navbar__link">گالری</a>
                    </li>
                    <li class="c-navbar__item">
                        <a href="#" class="c-navbar__link">نظرات و سوالات</a>
                    </li>
                    <li class="c-navbar__item">
                        <a href="#" class="c-navbar__link">مقالات</a>
                    </li>
                    <li class="c-navbar__item">
                        <a href="#" class="c-navbar__link">ارتباط با ما</a>
                    </li>
                    <li class="c-navbar__item c-navbar__item--mobile-only">
                        <a href="#" class="c-navbar__link">پروفایل</a>
                    </li>
                </ul>
            </nav>

            <div class="c-actions">
                <a href="#" class="c-actions__icon" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="#" class="c-actions__icon" aria-label="Twitter">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="#" class="c-actions__icon" aria-label="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="#" class="c-actions__icon" aria-label="Language">
                    <i class="fas fa-globe"></i>
                </a>

                <a href="#" class="c-actions__profile" aria-label="Profile">
                    <i class="fas fa-user-circle"></i>
                </a>
            </div>

        </div>
    </header>


    <!-- Hero Section -->
    <section class="c-hero">
        <div class="c-hero__video-wrapper">
            <video class="c-hero__video" autoplay loop muted playsinline>
                <source src="./assets/videos/Dentist_hero.mp4" type="video/mp4">
            </video>
            <div class="c-hero__overlay"></div>
        </div>

        <div class="c-hero__container">
            <div class="c-hero-card">
                <h1 class="c-hero-card__title">کلینیک تخصصی دندان پزشکی</h1>
                <p class="c-hero-card__subtitle">LumiDent | کلینیک تخصصی دندان‌پزشکی</p>
                <p class="c-hero-card__desc">
                    لبخندی سالم، زیبا و ماندگار؛ با تخصص، تکنولوژی و مراقبتی که شایسته شماست.
                </p>
                <a href="#" class="c-hero-card__btn">سریع نوبت بگیر</a>
            </div>

            <a href="#" class="c-hero__support">
                پشتیبانی <i class="fas fa-arrow-left"></i>
            </a>

            <a href="#next-section" class="c-hero__scroll-btn" id="js-scroll-btn" aria-label="Scroll Down">
                <i class="fas fa-arrow-down"></i>
            </a>
        </div>
    </section>


    <script src="./js/components_js/nav_menu.js"></script>
    <script src="./js/components_js/hero.js"></script>
</body>

</html>
