<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت نوبت‌ها - منشی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages_style/secretary.css">
</head>
<body class="secretary-body">

    <aside class="s-sidebar">
        <div class="s-sidebar__logo">
            <h2>LumiDent Admin</h2>
            <p>پنل مدیریت منشی</p>
        </div>
        <nav class="s-sidebar__nav">
            <a href="#" class="active"><i class="fas fa-calendar-check"></i> بررسی نوبت‌ها</a>
            <a href="../index.html"><i class="fas fa-home"></i> بازگشت به سایت</a>
            <a href="#" id="js-secretary-logout"><i class="fas fa-sign-out-alt"></i> خروج</a>
        </nav>
    </aside>

    <main class="s-main">
        <header class="s-header">
            <h1 class="s-header__title">مدیریت نوبت‌های درخواستی</h1>
            <div class="s-header__user">
                <span id="js-secretary-name">منشی عزیز، خوش آمدید</span>
            </div>
        </header>

        <section class="s-content">
            <div class="s-filters">
                <button class="s-btn-filter active" data-filter="all">همه نوبت‌ها</button>
                <button class="s-btn-filter" data-filter="pending">در حال بررسی</button>
                <button class="s-btn-filter" data-filter="approved">تایید شده‌ها</button>
            </div>

            <div class="s-table-wrapper">
                <table class="s-table">
                    <thead>
                        <tr>
                            <th>بیمار</th>
                            <th>خدمت / پزشک</th>
                            <th>تاریخ و ساعت</th>
                            <th>وضعیت</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="js-appointments-tbody">
                        <tr><td colspan="5" class="text-center">در حال بارگذاری...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Import Modules -->
    <script type="module" src="../js/utils_js/supabaseClient.js"></script>
    <script type="module" src="../js/utils_js/custom_error_modal.js"></script>
    <script type="module" src="../js/services_js/auth_service.js"></script>
    <script type="module" src="../js/services_js/appointments_service.js"></script>
    <script type="module" src="../js/pages_js/secretary.js"></script>
</body>
</html>
