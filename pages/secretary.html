<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد مدیریت کلینیک - منشی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    
</head>
<body class="secretary-body">

    <aside class="s-sidebar">
        <div class="s-sidebar__logo">
            <h2>لمی دنت</h2>
            <p>پنل مدیریت منشی</p>
        </div>
        <nav class="s-sidebar__nav">
            <a href="#" class="active"><i class="fas fa-calendar-check"></i> مدیریت نوبت‌ها</a>
            <a href="../index.html"><i class="fas fa-home"></i> بازگشت به سایت</a>
            <a href="#" id="js-secretary-logout"><i class="fas fa-sign-out-alt"></i> خروج از حساب</a>
        </nav>
    </aside>

    <main class="s-main">
        <header class="s-header">
            <div class="s-header__search">
                <i class="fas fa-search"></i>
                <input type="text" id="js-search-input" placeholder="جستجوی نام یا شماره موبایل بیمار...">
            </div>
            <div class="s-header__actions">
                <div class="s-header__notif" id="js-notif-bell">
                    <i class="fas fa-bell"></i>
                    <span class="s-notif-badge" id="js-notif-badge" style="display:none;">۰</span>
                </div>
                <div class="s-header__user">
                    <span id="js-secretary-name">خوش آمدید</span>
                </div>
            </div>
        </header>

        <section class="s-content">
            <div class="s-stats-grid">
                <div class="s-stat-card">
                    <div class="s-stat-icon" style="background:#e0f2fe; color:#0284c7;"><i class="fas fa-calendar-day"></i></div>
                    <div class="s-stat-info">
                        <span class="s-stat-label">نوبت‌های امروز</span>
                        <h3 class="s-stat-value" id="js-stat-today">۰</h3>
                    </div>
                </div>
                <div class="s-stat-card">
                    <div class="s-stat-icon" style="background:#fef08a; color:#a16207;"><i class="fas fa-hourglass-half"></i></div>
                    <div class="s-stat-info">
                        <span class="s-stat-label">در انتظار تایید</span>
                        <h3 class="s-stat-value" id="js-stat-pending">۰</h3>
                    </div>
                </div>
                <div class="s-stat-card">
                    <div class="s-stat-icon" style="background:#fecaca; color:#b91c1c;"><i class="fas fa-ban"></i></div>
                    <div class="s-stat-info">
                        <span class="s-stat-label">لغو و رد شده</span>
                        <h3 class="s-stat-value" id="js-stat-cancelled">۰</h3>
                    </div>
                </div>
            </div>

            <div class="s-filters-wrapper">
                <div class="s-filters">
                    <button class="s-btn-filter active" data-filter="all">همه نوبت‌ها</button>
                    <button class="s-btn-filter" data-filter="pending">در حال بررسی</button>
                    <button class="s-btn-filter" data-filter="approved">تایید شده</button>
                </div>

                <div class="s-doctor-filter-box">
                    <button class="s-btn-walkin" id="js-open-walkin-btn"><i class="fas fa-plus"></i> ثبت نوبت جدید</button>
                    <div class="s-select-wrapper">
                        <i class="fas fa-user-md"></i>
                        <select id="js-doctor-filter" class="s-doctor-select">
                            <option value="all">همه پزشکان</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="s-table-wrapper">
                <table class="s-table">
                    <thead>
                        <tr>
                            <th>اطلاعات بیمار</th>
                            <th>خدمت و پزشک</th>
                            <th>تاریخ و ساعت</th>
                            <th>وضعیت و پرداخت</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="js-appointments-tbody">
                        <tr><td colspan="5" class="text-center">در حال دریافت اطلاعات...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- مودال ثبت نوبت دستی با جستجو و تقویم -->
    <dialog id="js-walkin-modal" class="c-modal" style="max-width: 600px;">
        <div class="c-modal__container">
            <header class="c-modal__header">
                <h2 class="c-modal__title">ثبت نوبت حضوری / تلفنی</h2>
                <button type="button" class="c-modal__close js-walkin-close">&times;</button>
            </header>

            <div class="c-modal__body c-booking-form">

                <!-- انتخاب نوع کاربر -->
                <div class="s-user-type-toggle">
                    <label class="s-radio-label">
                        <input type="radio" name="userType" value="existing" checked> بیمار قبلی (جستجو)
                    </label>
                    <label class="s-radio-label">
                        <input type="radio" name="userType" value="new"> بیمار جدید (ثبت‌نام)
                    </label>
                </div>

                <!-- بخش جستجوی کاربر -->
                <div id="js-existing-user-section" class="s-booking-section">
                    <div class="c-booking-form__field">
                        <label class="c-booking-form__label">جستجوی بیمار (نام یا موبایل)</label>
                        <input type="text" id="js-user-search-input" class="c-booking-form__input" placeholder="تایپ کنید...">
                        <div id="js-user-search-results" class="s-search-results-box"></div>
                    </div>
                    <div id="js-selected-user-display" class="s-selected-user-info" style="display:none;"></div>
                </div>

                <!-- بخش ثبت نام کاربر جدید -->
                <div id="js-new-user-section" class="s-booking-section" style="display:none;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="c-booking-form__field">
                            <label class="c-booking-form__label">نام</label>
                            <input type="text" id="new-user-name" class="c-booking-form__input">
                        </div>
                        <div class="c-booking-form__field">
                            <label class="c-booking-form__label">نام خانوادگی</label>
                            <input type="text" id="new-user-family" class="c-booking-form__input">
                        </div>
                    </div>
                    <div class="c-booking-form__field">
                        <label class="c-booking-form__label">شماره موبایل (رمز عبور موقت)</label>
                        <input type="tel" id="new-user-phone" class="c-booking-form__input" placeholder="09...">
                    </div>
                </div>

                <hr style="border:0; border-top:1px solid #e2e8f0; margin:15px 0;">

                <!-- انتخاب پزشک -->
                <div class="c-booking-form__field">
                    <label class="c-booking-form__label">انتخاب پزشک معالج</label>
                    <select id="walkin-doctor" class="c-booking-form__input"></select>
                </div>

                <!-- تقویم و ساعت -->
                <div class="s-calendar-wrapper">
                    <div class="c-calendar-header">
                        <button type="button" id="js-w-prev-month" class="c-calendar__nav-btn"><i class="fas fa-chevron-right"></i></button>
                        <span id="js-w-month-label" class="c-calendar__month-label"></span>
                        <button type="button" id="js-w-next-month" class="c-calendar__nav-btn"><i class="fas fa-chevron-left"></i></button>
                    </div>
                    <div class="c-calendar-weekdays">
                        <span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span>
                    </div>
                    <div class="c-calendar-grid" id="js-w-calendar-grid"></div>
                </div>

                <div class="c-booking-form__field" style="margin-top: 15px;">
                    <label class="c-booking-form__label">ساعت‌های آزاد</label>
                    <div class="c-time-slots" id="js-w-time-slots">
                        <p style="font-size:12px; color:#64748b;">ابتدا تاریخ را انتخاب کنید</p>
                    </div>
                </div>

                <button type="button" id="js-submit-walkin" class="c-booking-form__submit" style="margin-top:20px;">ثبت نهایی و رزرو</button>
            </div>
        </div>
    </dialog>

    <dialog id="js-history-modal" class="c-modal">
        <div class="c-modal__container">
            <header class="c-modal__header">
                <h2 class="c-modal__title">سوابق بیمار</h2>
                <button type="button" class="c-modal__close js-history-close">&times;</button>
            </header>
            <div class="c-modal__body" id="js-history-content"></div>
        </div>
    </dialog>

    <div id="js-toast" class="s-toast"></div>

    <script type="module" src="../js/utils_js/supabaseClient.js"></script>
    <script type="module" src="../js/utils_js/custom_error_modal.js"></script>
    <script type="module" src="../js/services_js/auth_service.js"></script>
    <script type="module" src="../js/services_js/appointments_service.js"></script>
    <script type="module" src="../js/services_js/doctors_service.js"></script>
    <script type="module" src="../js/pages_js/secretary.js"></script>
</body>
</html>
